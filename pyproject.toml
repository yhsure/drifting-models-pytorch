[project]
name = "drifting-models-pytorch"
version = "0.1.0"
description = "PyTorch port of Generative Modeling via Drifting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "absl-py>=2.1.0",
  "accelerate>=1.13.0",
  "diffusers>=0.30.0",
  "einops>=0.8.0",
  "huggingface-hub>=0.24.0",
  "msgpack>=1.1.0",
  "numpy>=1.26.0",
  "opt-einsum>=3.4.0",
  "Pillow>=10.0.0",
  "pytorch-fid>=0.3.0",
  "PyYAML>=6.0.1",
  "scipy>=1.13.0",
  "torch>=2.11.0,<2.12",
  "torch-optimi>=0.3.3",
  "torchmetrics[image]>=1.4.0",
  "torchrun-jsc>=0.0.19",
  "torchvision>=0.26.0,<0.27",
  "tqdm>=4.66.0",
  "transformers>=4.44.0,<5",
  "wandb>=0.18.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataset", "models", "utils"]
include = ["*.py", "configs/**/*.yaml"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
