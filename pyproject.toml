[project]
name = "drifting-models-pytorch"
version = "0.0.1"
description = "Generative Models via Drifting Models in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "rectified-flow-pytorch",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchmetrics[image]>=1.4.0",
]

[dependency-groups]
dev = [
    "invoke>=2.2.0",
    "mkdocs>=1.6.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "ruff>=0.14.11",
    "ty",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drifting_models_pytorch"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
