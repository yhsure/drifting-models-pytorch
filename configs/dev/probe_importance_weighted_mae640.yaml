hsdp_dim: 1
compile: 2

logging:
  use_wandb: false
  log_every_k: 1

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 16
  eval_batch_size: 8
  kwargs:
    num_workers: 0
    pin_memory: true
    prefetch_factor: 2

model:
  cond_dim: 768
  input_size: 32
  in_channels: 4
  patch_size: 2

  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  out_channels: 4

  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: true

optimizer:
  lr_schedule:
    learning_rate: 0.0002
    warmup_steps: 5000
    lr_schedule: "const"
    total_steps: 100000
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95

train:
  train_batch_size: 2
  seed: 42
  total_steps: 4
  save_per_step: 1000
  keep_last: 1
  eval_per_step: 1000
  eval_samples: 16
  pos_per_sample: 64
  neg_per_sample: 16
  positive_bank_size: 128
  negative_bank_size: 1000
  forward_dict:
    gen_per_label: 64
    cfg_min: 1.0
    cfg_max: 4.0
    neg_cfg_pw: 3.0
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    every_k_block: 2
  loss_kwargs:
    R_list: [0.2, 0.05, 0.02]
  cfg_list: [2.5]
  ema_decay: 0.999
  push_per_step: 64
  push_at_resume: 1
  eval_on_step_one: false
  run_eval: false
  train_sample_per_step: 0
  pos_sampling:
    strategy: "importance_local_uniform"
    local_alpha: 0.85
    local_alpha_final: 0.55
    anneal_steps: 5000
    rank_temperature: 12.0
    top_k: 48
    min_ess_frac: 0.35
    max_importance_weight: 4.0
    normalize_weights: false

feature:
  mae_path: "hf://mae_latent_640"
  use_mae: true
  use_convnext: false
