hsdp_dim: 1

logging:
  use_wandb: false
  log_every_k: 1

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 8
  eval_batch_size: 8
  kwargs:
    num_workers: 0
    pin_memory: false
    prefetch_factor: 2

model:
  cond_dim: 128
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 128
  depth: 2
  num_heads: 4
  mlp_ratio: 2.0
  out_channels: 4
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 4
  noise_classes: 16
  noise_coords: 8

optimizer:
  lr_schedule:
    learning_rate: 0.0001
    warmup_steps: 1
    lr_schedule: "const"
    total_steps: 2
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95

train:
  train_batch_size: 8
  seed: 42
  total_steps: 2
  save_per_step: 100
  keep_last: 1
  eval_per_step: 1000
  eval_samples: 16
  pos_per_sample: 4
  neg_per_sample: 2
  positive_bank_size: 16
  negative_bank_size: 32
  forward_dict:
    gen_per_label: 2
    cfg_min: 1.0
    cfg_max: 2.0
    neg_cfg_pw: 1.0
    no_cfg_frac: 0.0
  activation_kwargs:
    patch_mean_size: [2]
    patch_std_size: [2]
    use_std: true
    use_mean: true
    every_k_block: 2
  loss_kwargs:
    R_list: [0.2, 0.05, 0.02]
    weight_mode: "measure"
  cfg_list: [1.0]
  ema_decay: 0.999
  push_per_step: 8
  push_at_resume: 1
  eval_on_step_one: false
  run_eval: false
  pos_sampling:
    strategy: "importance_feature_stratified"
    local_alpha: 1.0
    local_alpha_final: 0.8
    anneal_steps: 2
    strata_edges: [0.25, 0.5, 1.0]
    rank_temperatures: [0.1, 0.5]
    score_floor: 0.05
    min_per_stratum: 1
    max_importance_weight: 4.0
    min_ess_frac: 0.45
    weight_power: 0.0
    weight_power_final: 1.0
    weight_power_anneal_steps: 2
    use_anchor_features: true
    anchor_feature_key: "global"
    sync_bank_across_ranks: false

feature:
  use_mae: false
  use_convnext: false
  mae_path: ""
