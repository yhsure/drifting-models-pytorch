name: CI Pre-commit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  precommit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Pre-commit
        run: uv run pre-commit run --all-files
